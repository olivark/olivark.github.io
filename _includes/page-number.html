{% assign number = include.number %}
{% if number == paginator.page %}
<span aria-current="page" aria-label="Page {{ number }}">{{ number }}</span>
{% else %}
  {% assign pagination_url = site.paginate_path | replace: ':num', number %}
  {% if number == 1 %}{% assign pagination_url = '/' %}{% endif %}
<a href="{{ pagination_url | relative_url }}#posts-heading" aria-label="Page {{ number }}">{{ number }}</a>
{% endif %}
