---
layout: default
title: Articles
permalink: /articles/
description: "Search articles by Kévin Olivar and browse by topic, tag, or year."
---
<section class="article-browser" data-search-bundle="{{ '/pagefind/pagefind.js' | relative_url }}">
  <header class="page-header"><p class="section-kicker">From the workbench</p><h1>Articles</h1><p>Find a project, a practical guide, or something worth exploring.</p></header>
  <form id="article-search" role="search">
    <label for="query">Search articles</label>
    <div class="search-query"><input id="query" name="q" type="search" placeholder="Search by keyword…" autocomplete="off"><button type="submit">Search</button></div>
    <div class="search-filters">
      <div><label for="filter-topic">Topic</label><select id="filter-topic" name="topic"><option value="">All topics</option></select></div>
      <div><label for="filter-tag">Tag</label><select id="filter-tag" name="tag"><option value="">All tags</option></select></div>
      <div><label for="filter-year">Year</label><select id="filter-year" name="year"><option value="">All years</option></select></div>
      <div><label for="filter-sort">Sort</label><select id="filter-sort" name="sort"><option value="auto">Relevance / newest</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div>
    </div>
    <button type="reset" class="search-reset">Reset filters</button>
  </form>
  <p id="search-status" role="status" aria-live="polite">Loading articles…</p>
  <div id="search-results" class="search-results" aria-busy="true"></div>
  <nav class="pagination" aria-label="Search result pages"><button id="results-prev" hidden>← Previous</button><span id="results-page" hidden></span><button id="results-next" hidden>Next →</button></nav>
  <noscript><p>Search needs JavaScript. You can <a href="{{ '/' | relative_url }}">browse the articles on the homepage</a>.</p></noscript>
</section>
<script type="module" src="{{ '/assets/search.js' | relative_url }}"></script>
