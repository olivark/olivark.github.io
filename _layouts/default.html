<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/favicon.svg' | relative_url }}">
    <meta name="theme-color" content="#0d1117">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
      </div>
    </header>

    {% if page.hero %}
    <div class="hero">
      <div class="hero-content">
        <p class="hero-eyebrow">{{ page.hero_eyebrow | default: site.title }}</p>
        <h1 class="hero-heading">{{ page.hero_title | default: site.description }}</h1>
      </div>
    </div>
    {% endif %}

    <main class="wrap content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <a class="linkedin-link" href="https://www.linkedin.com/in/kevinolivar/" aria-label="Kévin Olivar on LinkedIn">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M20.45 3H3.55A.55.55 0 0 0 3 3.55v16.9c0 .3.25.55.55.55h16.9c.3 0 .55-.25.55-.55V3.55a.55.55 0 0 0-.55-.55ZM8.34 18.34H5.66V9.72h2.68v8.62ZM7 8.54a1.55 1.55 0 1 1 0-3.1 1.55 1.55 0 0 1 0 3.1Zm11.34 9.8h-2.67v-4.2c0-1 0-2.28-1.39-2.28-1.4 0-1.61 1.08-1.61 2.2v4.28H10V9.72h2.56v1.18h.04c.36-.67 1.23-1.38 2.53-1.38 2.7 0 3.2 1.78 3.2 4.09v4.73Z"/>
          </svg>
          <span>LinkedIn</span>
        </a>
      </div>
    </footer>
  </body>
</html>
