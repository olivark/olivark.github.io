<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/favicon.svg' | relative_url }}">
    <meta name="theme-color" content="#0d1117">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    {% if page.hero %}
    <div class="hero">
      <div class="hero-content">
        <p class="hero-eyebrow">{{ page.hero_eyebrow | default: site.title }}</p>
        <h1 class="hero-heading">{{ page.hero_title | default: site.description }}</h1>
      </div>
    </div>
    {% endif %}

    <main class="wrap content">
      {{ content }}
    </main>
  </body>
</html>
